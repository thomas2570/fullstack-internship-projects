# Render Blueprint for FS-04 (Multi-Tenant SaaS Project Management Platform)
services:
  # 1. Django Web API Service
  - type: web
    name: agileplatform-backend
    runtime: python
    rootDir: FS-04/backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: agileplatform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agileplatform-redis
          property: connectionString

  # 2. Celery Worker (Background tasks & Webhooks)
  - type: worker
    name: agileplatform-celery-worker
    runtime: python
    rootDir: FS-04/backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "celery -A core worker -l info --concurrency=2"
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agileplatform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agileplatform-redis
          property: connectionString

# Managed PostgreSQL Database
databases:
  - name: agileplatform-db
    databaseName: saas_pm_db
    user: postgres
    plan: free

# Managed Redis
redis:
  - name: agileplatform-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
